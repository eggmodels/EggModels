name: On-demand factory trigger

# Lets Eugenio kick off the factory right away instead of waiting for the
# Monday schedule: label any issue `factory-request` (easy from the GitHub
# mobile app) and this flags the factory VM's next boot with the request
# (as instance metadata -- NOT a commit to BACKLOG.md, since master is a
# protected branch and this workflow has no way to open+auto-merge a PR
# fast enough to matter) and starts it. run-factory.sh reads the flag and
# implements that request this run, ahead of the backlog. See
# software-factory/README.md#on-demand-runs.
on:
  issues:
    types: [labeled]

concurrency:
  group: factory-trigger
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event.label.name == 'factory-request' && github.event.issue.user.login == 'eugeniogarzag'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Rate-limit on-demand triggers
        id: ratelimit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          COUNT="$(gh run list --repo "${{ github.repository }}" --workflow=factory-trigger.yml \
            --json conclusion,createdAt --jq "[.[] | select(.conclusion==\"success\" and .createdAt >= \"$SINCE\")] | length")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already $COUNT successful on-demand triggers in the last 24h -- skipping to avoid a runaway loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        if: steps.ratelimit.outputs.skip == 'false'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FACTORY_TRIGGER_SA_KEY }}

      - if: steps.ratelimit.outputs.skip == 'false'
        uses: google-github-actions/setup-gcloud@v2

      - name: Flag the VM's next boot with this request, then start it
        if: steps.ratelimit.outputs.skip == 'false'
        run: |
          PAYLOAD="$(node -e '
            console.log(JSON.stringify({ title: process.argv[1], body: process.argv[2], issueNumber: process.argv[3] }));
          ' "${{ github.event.issue.title }}" "$(echo "${{ github.event.issue.body }}" | head -1)" "${{ github.event.issue.number }}" | base64 -w0)"

          gcloud compute instances add-metadata eggmodels-factory-vm \
            --project="${{ vars.FACTORY_GCP_PROJECT_ID || 'eggmodels-factory' }}" \
            --zone="${{ vars.FACTORY_GCP_ZONE || 'us-central1-a' }}" \
            --metadata=on-demand-request="$PAYLOAD"

          gcloud compute instances start eggmodels-factory-vm \
            --project="${{ vars.FACTORY_GCP_PROJECT_ID || 'eggmodels-factory' }}" \
            --zone="${{ vars.FACTORY_GCP_ZONE || 'us-central1-a' }}"

      - name: Acknowledge on the issue
        if: steps.ratelimit.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "Started the factory VM for this -- if it's already running (e.g. a weekly run in progress), this is queued for its next boot instead. The factory will comment here again and close this issue once it opens a PR. Watch https://egg-models.web.app/factory for the run record."

      - name: Note the skip on the issue
        if: steps.ratelimit.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "Already triggered ${{ steps.ratelimit.outputs.count }} on-demand runs in the last 24h -- skipping this one to avoid a runaway loop. It'll go out with the next scheduled run, or re-apply the factory-request label after the window resets."
