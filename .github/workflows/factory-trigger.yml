name: On-demand factory trigger

# Lets Eugenio kick off the factory right away instead of waiting for the
# Monday schedule: label any issue `factory-request` (easy from the GitHub
# mobile app) and this inserts it at the top of software-factory/BACKLOG.md
# and starts the factory VM. See software-factory/README.md#on-demand-runs.
on:
  issues:
    types: [labeled]

concurrency:
  group: factory-trigger
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event.label.name == 'factory-request' && github.event.issue.user.login == 'eugeniogarzag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Rate-limit on-demand triggers
        id: ratelimit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          COUNT="$(gh run list --repo "${{ github.repository }}" --workflow=factory-trigger.yml \
            --json conclusion,createdAt --jq "[.[] | select(.conclusion==\"success\" and .createdAt >= \"$SINCE\")] | length")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already $COUNT successful on-demand triggers in the last 24h -- skipping to avoid a runaway loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Insert backlog item at the top of the queue
        if: steps.ratelimit.outputs.skip == 'false'
        # Issue title/body are untrusted text; pass them through env vars
        # rather than splicing ${{ }} directly into the script below, so a
        # title like `"; rm -rf . #` can't break out of the quoted argument
        # and run as shell in a job with contents:write + the GCP key.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "software-factory/BACKLOG.md";
            const lines = fs.readFileSync(path, "utf8").split("\n");
            const idx = lines.findIndex((l) => l.startsWith("- [ ]"));
            const [title, bodyFirstLine, issueNumber] = process.argv.slice(1);
            const entry = `- [ ] ${title} — ${bodyFirstLine || "(see issue for details)"} (requested via issue #${issueNumber})`;
            const insertAt = idx === -1 ? lines.length : idx;
            lines.splice(insertAt, 0, entry);
            fs.writeFileSync(path, lines.join("\n"));
          ' "$ISSUE_TITLE" "$(printf '%s' "$ISSUE_BODY" | head -1)" "$ISSUE_NUMBER"

          git config user.name "factory-trigger-bot"
          git config user.email "factory-trigger-bot@users.noreply.github.com"
          git add software-factory/BACKLOG.md
          git commit -m "Add on-demand backlog item from issue #${{ github.event.issue.number }}"
          # actions/checkout leaves HEAD detached, so push explicitly to master.
          git push origin HEAD:master

      - id: auth
        if: steps.ratelimit.outputs.skip == 'false'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FACTORY_TRIGGER_SA_KEY }}

      - if: steps.ratelimit.outputs.skip == 'false'
        uses: google-github-actions/setup-gcloud@v2

      - name: Start the factory VM
        if: steps.ratelimit.outputs.skip == 'false'
        run: |
          gcloud compute instances start eggmodels-factory-vm \
            --project="${{ vars.FACTORY_GCP_PROJECT_ID || 'eggmodels-factory' }}" \
            --zone="${{ vars.FACTORY_GCP_ZONE || 'us-central1-a' }}"

      - name: Acknowledge on the issue
        if: steps.ratelimit.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "Queued at the top of software-factory/BACKLOG.md and started the factory VM -- it'll pick this up and open a PR shortly. Watch https://egg-models.web.app/factory for the run record."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"

      - name: Note the skip on the issue
        if: steps.ratelimit.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "Already triggered ${{ steps.ratelimit.outputs.count }} on-demand runs in the last 24h -- skipping this one to avoid a runaway loop. It'll go out with the next scheduled run, or re-apply the factory-request label after the window resets."
