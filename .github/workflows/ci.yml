name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fails the build on new critical-severity advisories in direct or
      # transitive deps. Pinned at "critical" (not "high") because several
      # high-severity findings come from react-scripts' dev-only toolchain
      # (webpack-dev-server etc.) with no non-breaking fix available; those
      # are tracked manually rather than gating every PR red.
      - run: npm audit --audit-level=critical
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm audit --audit-level=critical
        working-directory: functions

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Deliberately built with no REACT_APP_FIREBASE_* env vars set, mirroring
      # the 2026-11-02 incident (a build run without .env.local). The site must
      # still render instead of going blank - see src/firebase.ts.
      - run: npm run build
        env:
          CI: false
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke-test

  notify-on-failure:
    needs: [dependency-audit, unit-tests, smoke-test]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Email on CI failure
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          subject: 'EggModels CI failed on ${{ github.ref_name }}'
          to: egg@eggmodels.com
          from: EggModels CI
          body: |
            CI failed on ${{ github.repository }}@${{ github.ref_name }} (commit ${{ github.sha }}).
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
