name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Deliberately built with no REACT_APP_FIREBASE_* env vars set, mirroring
      # the 2026-11-02 incident (a build run without .env.local). The site must
      # still render instead of going blank - see src/firebase.ts.
      - run: npm run build
        env:
          CI: false
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke-test

  notify-on-failure:
    needs: [unit-tests, smoke-test]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Email on CI failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          subject: 'EggModels CI failed on ${{ github.ref_name }}'
          to: egg@eggmodels.com
          from: EggModels CI
          body: |
            CI failed on ${{ github.repository }}@${{ github.ref_name }} (commit ${{ github.sha }}).
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
