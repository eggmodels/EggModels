version: 2
updates:
  # Frontend (CRA app at repo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # react-scripts 5.0.1 (CRA) hard-pins typescript to ^3.2.1 || ^4 as a
      # peer dependency; a TS5+ bump breaks the build outright until CRA is
      # replaced (see PR #35/#48).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Firebase Cloud Functions
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
